name: Mirror to Gitea

on:
  push:
    branches:
      - "**"

jobs:
  mirror:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0     # Holt gesamte History, wichtig für vollständiges Mirroring

      - name: Push to Gitea (git.mci4me.at)
        run: |
          git config --global user.name "GitHub Mirror Bot"
          git config --global user.email "actions@github.com"

          # Gitea Remote einrichten
          git remote add gitea https://${{ secrets.GITEA_USER }}:${{ secrets.GITEA_TOKEN }}@${{ secrets.GITEA_URL#https:// }}

          # Alle Branches übertragen
          git push gitea --all

          # Tags übertragen (Versionen, Releases)
          git push gitea --tags
